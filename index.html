<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D3B6E" />
    <!-- PWA / installability -->
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OrthoStock" />
    <meta name="description" content="Inventory, sales, expenses, reports and investments for orthodontic supplies." />
    <title>OrthoStock</title>
    <!-- Tajawal: a clean, professional Arabic/Latin family widely used in Gulf UIs. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body, #root { height: 100%; margin: 0; }
      body {
        font-family: 'Tajawal', -apple-system, system-ui, sans-serif;
        background: #F3F6FB;
        color: #0E1D2E;
        -webkit-font-smoothing: antialiased;
      }
      input, button, select, textarea { font-family: inherit; }
      /* 16px minimum stops iOS Safari from auto-zooming when a field is focused. */
      input, select, textarea { font-size: 16px; }
      /* Mobile-safe bottom-sheet modal: use the dynamic viewport height (dvh) so
         nothing is hidden behind the browser toolbars, and pad for the notch /
         home indicator. The vh line is the fallback for browsers without dvh. */
      .modal-sheet { max-height: 92vh; max-height: 92dvh; }
      .modal-body { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
